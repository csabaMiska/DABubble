<div class="profile-popup" *ngIf="user$ | async as user">
  <div class="profile-popup-header">
    <h2 *ngIf="!showEditUserForm">Profil</h2>
    <h2 *ngIf="showEditUserForm">Dein Profil bearbeiten</h2>
    <button class="profile-popup-close-button" (click)="closeProfileView()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div class="profile-popup-image">
    <img src="{{ user.avatar }}" alt="Avatar">
  </div>

  <section *ngIf="!showEditUserForm" class="profile-popup-info-box">
    <div class="profile-popup-name-box">
      <span>{{ user.name }}</span>
      <button *ngIf="!showMessageBtn" (click)="enableEditing()">Bearbeiten</button>
    </div>
    <div class="profile-popup-status-box">
      <span class="profile-popup-indicator {{ user.status }}"></span>
      <span class="profile-popup-text">{{ user.status }}</span>
    </div>
  </section>
  <section *ngIf="!showEditUserForm" class="profile-popup-contact-info">
    <div class="profile-popup-contact-mail">
      <mat-icon>mail_outline</mat-icon>
      <span>E-Mail-Adresse</span>
    </div>
    <div class="profile-popup-mail-container">
      <a href="mailto:{{ user.email }}">{{ user.email }}</a>
    </div>
  </section>

  <section *ngIf="showEditUserForm" class="profile-popup-edit-user-form-section">
    <div class="profile-popup-contact-info">
      <div class="profile-popup-contact-mail">
        <svg width="25" height="25" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">

            fill="black" />
        </svg>
        <span>Vollständiger Name</span>
      </div>
    </div>
    <div class="profile-popup-edit-user-form-container">
      <form [formGroup]="editUserForm" (ngSubmit)="updateUserData()"  class="profile-popup-edit-user-form">
        <mat-form-field appearance="outline" class="form-field">
          <input formControlName="name" matInput placeholder="{{ user.name }}">
          <mat-error *ngIf="editUserForm.get('name')?.hasError('required')">Name ist erforderlich.</mat-error>
          <mat-error *ngIf="editUserForm.get('name')?.hasError('minlength')">Minimale Länge: 2.</mat-error>
        </mat-form-field>
        <div class="profile-popup-btn-container">
          <button type="button" class="profile-popup-edit-user-cancel-btn" (click)="enableEditing()">
            Abbrechen
          </button>
          <button type="submit" class="profile-popup-edit-user-save-btn">
            Speichern
          </button>
        </div>
      </form>
    </div>
  </section>

  <section *ngIf="showMessageBtn" class="profile-popup-btn-container">
    <button class="profile-popup-contact-send-button" (click)="openDirectChat(user.uid)">
      <svg xmlns="http://www.w3.org/2000/svg" height="18.61px" viewBox="0 -960 960 960" width="20px" fill="#e8eaed"
        stroke="white" stroke-width="24">
        <path
          d="M880-80 720-240H160q-33 0-56.5-23.5T80-320v-480q0-33 23.5-56.5T160-880h640q33 0 56.5 23.5T880-800v720ZM160-320h594l46 45v-525H160v480Zm0 0v-480 480Z" />
      </svg>
      Nachricht
    </button>
  </section>
</div>
