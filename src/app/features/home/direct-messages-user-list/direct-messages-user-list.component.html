<mat-expansion-panel class="expansion-panel" (opened)="panelOpenState.set(true)" (closed)="panelOpenState.set(false)">
    <mat-expansion-panel-header>
        <div class="expansion-panel-header">
            <mat-icon>{{ panelOpenState() ? 'arrow_drop_down' : 'arrow_drop_up' }}</mat-icon>
            <mat-icon class="expansion-panel-icon">account_circle</mat-icon>
            <span>Direktnachrichten</span>
        </div>
    </mat-expansion-panel-header>
    <div class="expansion-panel-content" *ngIf="users$ | async as users">
        <div *ngFor="let user of users" (click)="openDirectChat(user.uid, user.type)">
            <app-user-card [user]="user"></app-user-card>
            <!-- <div class="badge-container" matBadge="0" matBadgePosition="above after"></div> -->
        </div>
    </div>
</mat-expansion-panel>
