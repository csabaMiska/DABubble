<section class="dashboard-container">
    <div class="dashboard-content">
        <app-channel-window class="app-channel" *ngIf="channelWindowIsOpen"></app-channel-window>
        <app-answer-window class="app-thread" *ngIf="answerWindowIsOpen"></app-answer-window>
        <app-chat-window class="app-new-message" *ngIf="chatWindowIsOpen"></app-chat-window>
    </div>
</section>
