<section class="add-user-dialog-container">
    <div class="add-user-dialog-header-container">
        <h3>Leute hinzufügen</h3>
        <button (click)="closeAddUserDialog()">
            <mat-icon>close</mat-icon>
        </button>
    </div>
    <div class="add-user-dialog-content">
        <mat-radio-group class="radio-group" [(ngModel)]="selectedRadioValue" (change)="onRadioChange($event)">
            <mat-radio-button value="1">Alle Mitglieder von {{ channelTitle }} hinzufügen</mat-radio-button>
            <mat-radio-button value="2">Bestimmte Leute hinzufügen</mat-radio-button>
        </mat-radio-group>
        <div class="add-user-dialog-input-container" *ngIf="showAddUsersInput">
            <div class="user-tags-container" *ngIf="(selectedUsersData$ | async)!.length > 0">
                <span *ngFor="let user of selectedUsersData$ | async" class="user-tag">
                    <app-user-card [user]="user" [isSelectedUser]="true" (userRemoved)="removeUserFromSelectedUsers($event.userUid)"></app-user-card>
                </span>
            </div>
            <div #editableDiv class="editable-div" contenteditable="true" placeholder="Name eingeben"
                (input)="onEditableInput(editableDiv)">
            </div>
        </div>
        <app-object-picker *ngIf="objectSelectorIsOpen" [ngStyle]="calculateObjectSelectorPosition(inputRects)"
            [contents]="filteredUsers" (selectedObject)="addUserToSelectedUsers($event.objectId)"></app-object-picker>
    </div>
    <div class="add-user-dialog-button-container">
        <button [disabled]="showAddUsersInput && (selectedUsersData$ | async)!.length <= 0"
            [class.button-disabled]="showAddUsersInput && (selectedUsersData$ | async)!.length <= 0"
            (click)="addUsersToChannel()">Erstellen</button>
    </div>
</section>
