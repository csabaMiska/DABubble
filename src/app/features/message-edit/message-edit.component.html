<section class="message-edit-container">
    <form class="message-edit-input-content">
        <div class="message-edit-field">
            <textarea type="text" [value]="message.content" rows="4" #editTextarea>
        </textarea>
        </div>
        <div class="message-edit-icons-container">
            <div class="message-edit-prefix-icons">
                <button class="icon-btn" type="button">
                    <mat-icon>sentiment_satisfied</mat-icon>
                </button>
                <button class="icon-btn" type="button">
                    <mat-icon>alternate_email</mat-icon>
                </button>
            </div>
            <div class="message-edit-btn-container">
                <button class="secondary-btn" type="submit">
                    Abbrechen
                </button>
                <button class="primary-btn" type="submit">
                    Speichern
                </button>
            </div>
        </div>
    </form>
</section>
