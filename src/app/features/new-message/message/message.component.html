<section class="message-container" *ngFor="let message of (messagesWithUserData$ | async); let i = index">
    <div class="message-content-container">
        <div class="timestamp-container" *ngIf="shouldShowTimestamp(message, i)">
            <div class="line-style"></div>
            <div class="timestamp">{{ message.timestamp | customDate }}</div>
            <div class="line-style"></div>
        </div>
        <app-hover-overlay-menu 
        [messageId]="message.messageId"
        [isSender]="message.isSender"
        (emojiSelected)="emitedEmojiSelected($event.emoji, $event.messageId)"
        ></app-hover-overlay-menu>
        <div class="message-content" [ngClass]="{'chat-bubble-reverse-positioning': !message.isSender }">
            <div class="message-content-user-content">
                <div class="message-content-user-name"
                    [ngClass]="{'chat-bubble-reverse-positioning': !message.isSender }">
                    <span class="message-timestamp">{{ message.timestamp | date:'HH:mm'}} Uhr</span>
                    <span class="message-user-name">{{ message.senderData.name }}</span>
                </div>
                <div class="message-content-user-message"
                    [ngClass]="{'chat-bubble-reverse-positioning': !message.isSender }">
                    <span class="message-bubble" [ngClass]="{'chat-bubble-reverse-desing': !message.isSender }">{{
                        message.content }}</span>
                </div>
                <div class="message-content-message-reaction-container" 
                    [ngClass]="{'chat-bubble-reverse-positioning': !message.isSender }">
                    <div class="reacted-emojis-container" *ngFor="let reaction of getReactions(message)"
                        [ngClass]="{'chat-bubble-reverse-positioning': !message.isSender }">
                        <div class="reacted-emoji" (click)="deleteSelectedEmoji(message.messageId, reaction.emoji)">
                            <span>{{ reaction.emoji.unicode }}</span>
                            <span>{{ reaction.counter }}</span>
                        </div>
                    </div>
                    <div class="add-reaction-container">
                        <mat-icon (click)="openCloseEmojiPicker($event, message.messageId)">add_reaction</mat-icon>
                        <app-emoji-picker *ngIf="showEmojiPicker[message.messageId]"
                            [buttonRect]="buttonRects[message.messageId]" class="emoji-picker"
                            (click)="closeAllPickers()"
                            (emojiSelected)="addEmojiSelection($event, message.messageId)"></app-emoji-picker>
                    </div>
                </div>
            </div>
            <div class="message-content-user-img" [ngClass]="{'avatar-reverse-design': !message.isSender }">
                <img src="{{ message.senderData.avatar }}" alt="Avatar">
            </div>
        </div>
    </div>
</section>
